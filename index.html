<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool AyaMark</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="container">

    <div class="sidebar">
        <img src="assets/logo.png" class="logo" alt="AyaMark Logo">

        <h1>TOOL AYAMARK</h1>
        <p>Cyberpunk Demo Interface</p>

        <hr>

        <h3>System Status</h3>
        <p>● Online</p>
        <p>Version 1.0</p>

        <hr>

        <p class="creator">Created by AyaMark</p>
    </div>

    <div class="main">

        <h2>Username</h2>

        <input
            type="text"
            id="username"
            placeholder="Enter Roblox Username">

        <button id="startBtn">
            START
        </button>

        <div class="progress-box">

            <div class="progress">
                <div id="bar"></div>
            </div>

            <p id="percent">0%</p>

        </div>

        <div id="logs">

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
